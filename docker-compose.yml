services:
  mongo:
    image: mongo:4.4
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # backend:
  #   build:
  #     context: .
  #     dockerfile: server/Dockerfile
  #   # container_name: backend
  #   environment:
  #     DATABASE_URL: mongodb://mongo:27017/finalproject
  #     PORT: 3000
  #   depends_on:
  #     - mongo
  #   expose:
  #     - "3000"


  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: mongodb://mongo:27017/finalproject
      PORT: 3000
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/getstudents"]
      interval: 5s
      retries: 5


  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
