<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <title>Home</title>
    <link rel="stylesheet" href="//netdna.bootstrapcdn.com/bootstrap/3.0.3/css/bootstrap.min.css">
    <script src="//ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.1/jquery.validate.min.js"></script>
    <script src="/js/home_page.js"></script>
    <link rel="stylesheet" href="/css/styleHome.css">

</head>

<body>
    <div id="logo-container">
        <a href="#" id="btnHome" onclick="home()">
            <img src="https://yedion.jce.ac.il/info/images/CollegeLogo.png" alt="Logo">
        </a>
    </div>
    <div class="col-sm-6 col-sm-offset-3">

        <form id="id_project" name="id_login">

            <h1 id="title"></h1>
            <div id="id-list-group" class="form-group">
                <label id="lbl_projects" for="project">Projects list:</label>
                <div class="custom-select">
                    <select name="projects_name" id="projects_name"></select>
                </div>
            </div>

            <div id="explanation-group" class="form-group">
                <label id="explanation" for="name">Explanation</label>
                <input type="text" class="form-control" name="id_explanation" id="id_explanation"
                    placeholder="An explanation of the project will appear here." disabled>
            </div>

            <div id="status-group" class="form-group">
                <label for="status">Status</label>
                <input type="text" class="form-control" name="status_id" id="status_id" placeholder="Project status"
                    disabled>
            </div>

             <div id="num-stds-group" class="form-group">
                <label for="numStds">Number of students</label>
                <input type="text" class="form-control" name="num_stds_id" id="num_stds_id" placeholder="Number of students participating in this project"
                    disabled>
            </div>

            <div class="button-container">
                <button id="editProjbtn">Edit</button>
            </div>
            <div class="button-container">
                <button id="sendingARequest" type="submit" onclick="getIdModFromPro(event)">Sending a request</button>
            </div>
            <div class="button-container">
                <button id="deleteProjectBtn" style="display:none;">Project termination</button>
            </div>
            <div id="button-container">
                <center><button id="monitoringTblBtn" style="display:none;">Monitoring table</button></center>
            </div>
        </form>
    </div>

</body>
</html>
