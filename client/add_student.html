<!doctype html>
<html lang="he" dir="rtl">

<head>
    <title>Add student</title>
    <link rel="stylesheet" href="//netdna.bootstrapcdn.com/bootstrap/3.0.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/css/all.min.css">
    <script src="//ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js
    "></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.1/jquery.validate.min.js"></script>
    <link rel="stylesheet" href="/css/addStudent.css">
    <script src="/js/add_student.js"></script>
    <script src="/js/Login.js"></script>
</head>

<body>
    <div id="logo-container">
        <a href="#" id="btnHome" onclick="home()">
        </a>
    </div>

    <div class="col-sm-6 col-sm-offset-3">

        <form id="id_project" name="id_login" onsubmit="add_studen(event)">
            <h1>Add Student</h1>
            <div id="name-group" class="form-group">
                <label for="name">Username</label>
                <input type="text" class="form-control" name="sdt_username_id" id="sdt_username_id"
                    placeholder="Username" required>
            </div>

            <div id="name-group" class="form-group">
                <label for="password">Password</label>
                <div style="position: relative;">
                    <input type="password" class="form-control" name="sdt_pswd_id" id="sdt_pswd_id"
                        required>
                    <i class="far fa-eye" id="chbx_shw_pwd_id" onclick="showPassword('sdt')"
                        style="position: absolute; top: 50%; transform: translateY(-50%); left: 10px; cursor: pointer;"></i>
                </div>
            </div>


            <div id="name-group" class="form-group">
                <label for="firstName">First name</label>
                <input type="text" class="form-control" name="firstName_sdt_id" id="firstName_sdt_id"
                    placeholder="First name" required>
            </div>

            <div id="name-group" class="form-group">
                <label for="lastName">Last name</label>
                <input type="text" class="form-control" name="lastName_sdt_id" id="lastName_sdt_id"
                    placeholder="Last name" required>
            </div>

            <div id="name-group" class="form-group">
                <label for="id_mod">ID</label>
                <input type="text" class="form-control" name="id_sdt" id="id_sdt" placeholder="ID" required>
            </div>

            <div id="id-group" class="form-group">
                <label for="email_mod">Email address:</label>
                <input type="email" class="form-control" name="email_sdt_id" id="email_sdt_id" placeholder="Email address"
                    required>
            </div>

            <div class="button-container">
                <button type="submit" class="btn btn-success" ;
                    style="align-items: center;">Submit</button>
            </div>
        </form>

    </div>
</body>

</html>
