<!doctype html>
<html lang="he" dir="rtl">

<head>
    <title>Update submission date</title>
    <link rel="stylesheet" href="//netdna.bootstrapcdn.com/bootstrap/3.0.3/css/bootstrap.min.css">
    <script src="//ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js
    "></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.1/jquery.validate.min.js"></script>
    <link rel="stylesheet" href="/css/updateDates.css">
    <script src="/js/update_dates.js"></script>
</head>

<body>
    <div id="logo-container">
        <a href="#" id="btnHome" onclick="home()">
        </a>
    </div>
    <center>
        <div id="dates">
            <h1 id="subDates">Submission dates</h1>
            </br>
            <div class="input-container">
                <label>Proposal report</label>
                <br>
                <input class="custom-label" type="date" id="proposal_id">
                <input class="custom-pre" placeholder="Current date" name="previousDate" id="prevProp">
            </div>

            <div class="input-container">
                <label>Alpha Report</label><br>
                <input class="custom-label" type="date" id="alfa_id">
                <input class="custom-pre" placeholder="Current date" name="previousDate" id="prevAlfa">
            </div>

            <div class="input-container">
                <label>Beta report</label><br>
                <input class="custom-label" type="date" id="beta_id">
                <input class="custom-pre" placeholder="Current date" name="previousDate" id="prevBeta">
            </div>

            <div class="input-container">
                <label>Final report</label><br>
                <input class="custom-label" type="date" id="final_id">
                <input class="custom-pre" placeholder="Current date" name="previousDate" id="prevFinal">
            </div>

            <div class="input-container">
                <label>Project presentation</label><br>
                <input class="custom-label" type="date" id="presentation_id">
                <input class="custom-pre" placeholder="Current date" name="previousDate" id="prevPresnt">
            </div>
        </div>
        <div class="button-container">
            <button type="submit" id="okBtn" class="btn btn-success" ;
                style="align-items: center;">Submit</button>
        </div>
    </center>
</body>

</html>
