name: Run Docker Compose Tests

on:
  push:
    branches:
      - main

jobs:
  docker-test:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Docker
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      # Run Docker Compose
      - name: Run Docker Compose
        id: docker
        run: docker compose up -d --build
        continue-on-error: false
        env:
          MONGO_USER: ${{ secrets.MONGO_USER }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}  

      # Wait for services to be ready
      - name: Wait for services
        run: |
          echo "Waiting for services to start..."
          sleep 30
        
      # Test API
      - name: Test Get All Students
        run: |
          for i in {1..15}; do
            STATUS=$(docker compose exec -T backend curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/getstudents)
            echo "Attempt $i - Status code: $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "API is up!"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 10
          done
          echo "Test failed: API did not become ready in time"
          exit 1

      # Send email if any step failed
      - name: Send failure email
        if: ${{ failure() }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Workflow Failed"
          body: "Docker Compose or API test failed! Check GitHub Actions logs."
          to: ${{ secrets.EMAIL }}
          from: ${{ secrets.SMTP_USER }}
          secure: true

      - name: Login to Docker Hub
        if: success()
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Images
        if: success()
        run: |
          export TZ='Asia/Jerusalem'
          TAG=$(date +%Y%m%d-%H%M%S)
          docker build -t bzl123/ci-cd-final_project:backend-$TAG -f server/Dockerfile .
          docker build -t bzl123/ci-cd-final_project:nginx-$TAG -f nginx/Dockerfile .
          docker push bzl123/ci-cd-final_project:backend-$TAG
          docker push bzl123/ci-cd-final_project:nginx-$TAG
      
      # Shutdown Docker Compose
      - name: Shutdown Docker Compose
        if: always()
        run: docker compose down

      # Deploy to EC2
      - name: Deploy to EC2
        if: success()
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            docker compose pull
            docker compose down
            docker compose up -d
